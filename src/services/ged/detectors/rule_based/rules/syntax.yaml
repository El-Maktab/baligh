# Syntax declarative rules for the GED rule-based detector.

- id: SY_DEM_HADHANI_FEM
  category: SY
  subtype: demonstrative_dual_gender
  tier: tier_1_rule_derived
  explanation: "الصواب «هاتان» مع الاسم المثنى المؤنث لا «هذان»."
  pattern:
    match: sequence
    tokens:
      - form: "هذان"
      - pos: NOUN
        gender: feminine
        number: dual
    flag_token: 0

- id: SY_DEM_HATANI_MASC
  category: SY
  subtype: demonstrative_dual_gender
  tier: tier_1_rule_derived
  explanation: "الصواب «هذان» مع الاسم المثنى المذكر لا «هاتان»."
  pattern:
    match: sequence
    tokens:
      - form: "هاتان"
      - pos: NOUN
        gender: masculine
        number: dual
    flag_token: 0

- id: SY_DEM_HADHAYNI_FEM
  category: SY
  subtype: demonstrative_dual_gender
  tier: tier_1_rule_derived
  explanation: "الصواب «هاتين» مع الاسم المثنى المؤنث لا «هذين»."
  pattern:
    match: sequence
    tokens:
      - form: "هذين"
      - pos: NOUN
        gender: feminine
        number: dual
    flag_token: 0

- id: SY_DEM_HATAYNI_MASC
  category: SY
  subtype: demonstrative_dual_gender
