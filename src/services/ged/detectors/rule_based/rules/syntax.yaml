- id: SY_DEM_HADHANI_CASE_OBLIQUE_NOUN
  category: SY
  subtype: demonstrative_dual_case
  tier: tier_1_rule_derived
  explanation: "إذا جاء بعد «هذان» اسم مثنى مذكر غير مرفوع فهناك خلل في المطابقة الإعرابية."
  pattern:
    match: sequence
    tokens:
      - form: "هذان"
      - pos: NOUN
        gender: masculine
        number: dual
        case: accusative
    flag_token: 1

- id: SY_DEM_HADHAYNI_CASE_NOM_NOUN
  category: SY
  subtype: demonstrative_dual_case
  tier: tier_1_rule_derived
  explanation: "إذا جاء بعد «هذين» اسم مثنى مذكر مرفوع فهناك خلل في المطابقة الإعرابية."
  pattern:
    match: sequence
    tokens:
      - form: "هذين"
      - pos: NOUN
        gender: masculine
        number: dual
        case: nominative
    flag_token: 1

- id: SY_DEM_PREP_HADHAYNI_CASE_NOM_NOUN
  category: SY
  subtype: demonstrative_dual_case
  tier: tier_1_rule_derived
  explanation: "بعد حرف الجر يكون الاسم بعد «هذين» مجرورًا لا مرفوعًا."
  pattern:
    match: sequence
    tokens:
      - form_regex: "^(?:[وف])?[بلك]هذين$"
        pos: PRON_DEM
      - pos: NOUN
        gender: masculine
        number: dual
        case: nominative
    flag_token: 1

