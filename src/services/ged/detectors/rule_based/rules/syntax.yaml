- id: SY_LAM_JUSSIVE
  category: SY
  subtype: jussive_operator
  tier: tier_1_rule_derived
  explanation: "الفعل المضارع بعد «لم» يجب أن يكون مجزومًا."
  pattern:
    match: sequence
    tokens:
      - form: "لم"
      - pos: VERB
        tense: present
        form_regex: "(?:ي|ون)$"
    flag_token: 1

- id: SY_LAMMA_JUSSIVE
  category: SY
  subtype: jussive_operator
  tier: tier_1_rule_derived
  explanation: "الفعل المضارع بعد «لما» يجب أن يكون مجزومًا."
  pattern:
    match: sequence
    tokens:
      - form: "لما"
      - pos: VERB
        tense: present
        form_regex: "(?:ي|ون)$"
    flag_token: 1

- id: SY_LA_NAHIYA_JUSSIVE
  category: SY
  subtype: jussive_operator
  tier: tier_1_rule_derived
  explanation: "الفعل المضارع بعد «لا» الناهية يجب أن يكون مجزومًا."
  pattern:
    match: sequence
    tokens:
      - form: "لا"
      - pos: VERB
        tense: present
        person: second
        mood: indicative
    flag_token: 1

- id: SY_LA_NAFIYA_NOT_JUSSIVE
  category: SY
  subtype: jussive_operator
  tier: tier_1_rule_derived
  explanation: "«لا» النافية لا تجزم الفعل المضارع."
  pattern:
    match: sequence
    tokens:
      - form: "لا"
      - pos: VERB
        tense: present
        person: third
        form_regex: "وا$"
    flag_token: 1

- id: SY_INNA_SISTERS_DUAL_ACCUSATIVE
  category: SY
  subtype: inna_sisters_case
  tier: tier_1_rule_derived
  explanation: "أخوات إن تنصب الاسم، والمثنى بعدها يكون منصوبًا بالياء لا مرفوعًا."
  pattern:
    match: sequence
    tokens:
      - form_in: ["إن", "كأن", "لعل", "لكن", "ليت", "أن"]
      - pos: NOUN
        number: dual
        case: nominative
    flag_token: 1
