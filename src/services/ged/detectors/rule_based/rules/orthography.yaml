# Orthographic declarative rules for the GED rule-based detector.

- id: OT_ALIF_MAQSURA_ALA
  category: OT
  subtype: alif_maqsura
  tier: tier_1_rule_derived
  explanation: "الصواب «على» لا «علي»."
  pattern:
    match: token
    form: "علي"
    lemma_in: ["عَلَى"]

- id: OT_ALIF_MAQSURA_HATTA
  category: OT
  subtype: alif_maqsura
  tier: tier_1_rule_derived
  explanation: "الصواب «حتى» لا «حتي»."
  pattern:
    match: token
    form: "حتي"
    lemma_in: ["حَتَّى"]

- id: OT_TANWIN_NASB_ON_ALIF
  category: OT
  subtype: tanwin
  tier: tier_1_rule_derived
  explanation: "تنوين النصب يُكتب على الحرف الذي قبل الألف لا على الألف نفسها."
  pattern:
    match: token
    form_regex: "اً$"

- id: OT_IDGHAM_AN_MA
  category: OT
  subtype: idgham
  tier: tier_1_rule_derived
  explanation: "الأفصح إدغام «عن ما» في «عمّا» عندما تليها جملة فعلية."
  pattern:
    match: sequence
    tokens:
      - form_in: ["عن", "وعن"]
      - form: "ما"
      - pos: VERB
    flag_token: 0

- id: OT_IDGHAM_MIN_MA
  category: OT
  subtype: idgham
  tier: tier_1_rule_derived
  explanation: "الأفصح إدغام «من ما» في «ممّا» عندما تليها جملة فعلية."
  pattern:
    match: sequence
    tokens:
      - form_in: ["من", "ومن"]
      - form: "ما"
      - pos: VERB
    flag_token: 0

- id: OT_TA_MARBUTA_NOUN
  category: OT
  subtype: ta_marbuta
  tier: tier_1_rule_derived
  explanation: "الاسم المؤنث يُكتب بتاء مربوطة (ة) لا هاء (ه)."
  pattern:
    match: token
    pos: NOUN
    gender: feminine
    form_ends_with: "ه"

- id: OT_TA_MARBUTA_ADJ
  category: OT
  subtype: ta_marbuta
  tier: tier_1_rule_derived
  explanation: "الصفة المؤنثة تُكتب بتاء مربوطة (ة) لا هاء (ه)."
  pattern:
    match: token
    pos: ADJ
    gender: feminine
    form_ends_with: "ه"

- id: OT_TA_MARBUTA_NOUN_PROP
  category: OT
  subtype: ta_marbuta
  tier: tier_1_rule_derived
  explanation: "الاسم العلم المؤنث يُكتب بتاء مربوطة (ة) لا هاء (ه)، مثل: مكة، فاطمة."
  pattern:
    match: token
    pos: NOUN_PROP
    gender: feminine
    form_ends_with: "ه"

- id: OT_INNA_AFTER_QAWL
  category: OT
  subtype: hamza
  tier: tier_1_rule_derived
  explanation: "همزة «إن» تُكسر وجوباً بعد القول."
  pattern:
    match: sequence
    tokens:
      - lemma_in: ["قَالَ", "يَقُول", "قُلْ", "قَائِل", "قَوْل"]
      - form_regex: "^(ان|أن)(?:ه|ها|هم|هن|نا|ني|ي|ك|كم|كن)?$"
    flag_token: 1

- id: OT_IDHA_HAMZA
  category: OT
  subtype: hamza
  tier: tier_1_rule_derived
  explanation: "«إذا» تُكتب بهمزة قطع تحت الألف."
  pattern:
    match: token
    form: "اذا"

- id: OT_ARWAH_HAMZA
  category: OT
  subtype: hamza
  tier: tier_1_rule_derived
  explanation: "كلمة «أرواح» جمع تكسير تُكتب بهمزة قطع على الألف."
  pattern:
    match: token
    form: "ارواح"

- id: OT_AQAL_HAMZA
  category: OT
  subtype: hamza
  tier: tier_1_rule_derived
  explanation: "أفعل التفضيل «أقل» يُكتب بهمزة قطع على الألف."
  pattern:
    match: token
    form: "اقل"
