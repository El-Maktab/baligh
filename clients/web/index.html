<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logos/Logo_light.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f4fbf6" />
    <meta
      name="description"
      content="بليغ، مساعد ذكي للكتابة العربية الدقيقة والواضحة."
    />
    <script>
      (() => {
        const key = "baligh-theme";
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch {
          // Storage may be unavailable in restricted browser contexts.
        }
        const resolved = stored === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <title>بليغ | مساعد الكتابة العربية</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
