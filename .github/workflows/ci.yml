name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Cache NLP Data (Farasa & CAMeL Tools)
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.camel_tools
          key: ${{ runner.os }}-nlp-data-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nlp-data-

      - name: Download CAMeL Tools Data
        run: |
          uv run camel_data -i morphology-db-msa-r13
          uv run camel_data -i disambig-mle-calima-msa-r13

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest
